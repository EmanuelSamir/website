name: Deploy Zola to GitHub Pages

on:
  push:
    branches:
      - master

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Build and Deploy
        uses: shalozz/zola-deploy-action@v0.19.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          PAGES_BRANCH: gh-pages
          BUILD_DIR: public
          # Este flag es opcional pero ayuda si GitHub Pages sigue detectando Jekyll
          # SKIP_DIR_CHECK: true
